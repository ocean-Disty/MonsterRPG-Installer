# Tells any participating launcher (MonsterRPGAudioLaunch, BLTickRateLaunch)
# that this folder has a DLL to inject, and when.
#
# Lower order = injected earlier. BLTickRate is 10 because it rewrites engine
# constants that are read once during startup; anything that merely waits for
# the game to be up can sit at 30 or later.
dll=bin\BLTickRate.dll
order=10
name=BLTickRate
