# BLTickRate configuration
#
# TickShift sets how fast Blockland's simulation runs.
# Change the number, save, restart the game. No rebuilding needed.
#
#   5  =  32 ms per tick  =  31.25 ticks/sec   (Blockland's normal speed)
#   4  =  16 ms per tick  =  62.5  ticks/sec   (recommended)
#   3  =   8 ms per tick  =  125   ticks/sec   (demanding - see README)
#
# Higher tick rates cost CPU on both the server and every client. If the game
# stutters, go back to 4. Anything outside 3-5 is ignored.

TickShift = 3
