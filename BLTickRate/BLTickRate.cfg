# BLTickRate configuration
#
# TickShift sets how fast Blockland's simulation runs.
# Change the number, save, restart the game. No rebuilding needed.
#
#   5  =  32 ms per tick  =  31.25 ticks/sec   (Blockland's normal speed)
#   4  =  16 ms per tick  =  62.5  ticks/sec
#   3  =   8 ms per tick  =  125   ticks/sec   (what MonsterRPG servers run)
#
# LEAVE THIS AT 3 FOR MONSTERRPG.
#
# Both ends have to be on the same number. A client on 4 against a server on 3
# moves at half speed with a view that jitters, and nothing on screen says why.
# So this is not really a taste setting, it is a "match the server" setting.
#
# Higher tick rates do cost CPU on both ends. If your game genuinely cannot
# keep up you can drop to 4, but only on a server that is also running 4.
# Anything outside 3-5 is ignored.

TickShift = 3
