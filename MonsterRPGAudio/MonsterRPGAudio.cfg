# ===========================================================================
#  MonsterRPGAudio settings
#
#  Plain text. One KEY=VALUE per line. Lines starting with # are ignored.
#  Save and restart the game; nothing here is read while it is running.
#
#  Deleting this file is safe - every setting below is already its default.
# ===========================================================================


# ---------------------------------------------------------------------------
#  Volume, 0.0 to 2.0. 1.0 is normal.
#
#  These live here rather than in the game so they survive a server that is
#  down, and so they apply on the main menu.
# ---------------------------------------------------------------------------
VolumeSfx=1.0
VolumeMusic=0.6
VolumeVoice=1.0


# ---------------------------------------------------------------------------
#  HRTF - the head-related filtering that makes a sound seem to come from
#  above, behind, or below rather than just left or right.
#
#  Turn this OFF (0) if you already use Windows Sonic, Dolby Atmos for
#  Headphones, or a headset with its own spatial audio. Two spatialisers
#  stacked on each other sound worse than either one alone.
#
#  Not used yet - Phase 4.
# ---------------------------------------------------------------------------
HRTF=1


# ---------------------------------------------------------------------------
#  GpuMode - auto | on | off
#
#  READ THIS BEFORE CHANGING IT, because the name is misleading.
#
#  This does NOT decide whether you get ray-traced audio. You do, always. The
#  sound is traced on the SERVER's graphics card and sent to you as numbers,
#  so a ten-year-old GPU hears exactly what a new one hears.
#
#  What it decides is whether that tracing may one day be done on YOUR machine
#  instead of the server's - which needs a card that can trace rays in
#  hardware (NVIDIA RTX 3000 or newer, AMD RX 6000 or newer). That feature is
#  not built yet. For now this only controls what gets written to the log.
#
#     auto   work it out. The default.
#     on     ignore the check and treat this machine as eligible.
#     off    do not probe the graphics card at all.
#
#  If the log says your card was refused and you think that is wrong, put
#  "on" here - and please tell us what card it is, because that is a bug in
#  the check and not in your computer.
# ---------------------------------------------------------------------------
GpuMode=auto
