# ===========================================================================
#  MonsterRPGAudio settings
#
#  Plain text. One KEY=VALUE per line. Lines starting with # are ignored.
#  Save and restart the game; nothing here is read while it is running.
#
#  Deleting this file is safe - every setting below is already its default.
# ===========================================================================


# ---------------------------------------------------------------------------
#  Volume, 0.0 to 2.0. 1.0 is normal.
#
#  These live here rather than in the game so they survive a server that is
#  down, and so they apply on the main menu.
# ---------------------------------------------------------------------------
VolumeSfx=1.0
VolumeMusic=0.6
VolumeVoice=1.0


# ---------------------------------------------------------------------------
#  HRTF - the head-related filtering that makes a sound seem to come from
#  above, behind, or below rather than just left or right.
#
#  Turn this OFF (0) if you already use Windows Sonic, Dolby Atmos for
#  Headphones, or a headset with its own spatial audio. Two spatialisers
#  stacked on each other sound worse than either one alone.
#
#  What it does: a delay between your ears (the near ear hears it first), a
#  frequency-dependent shadow cast by your head, and a moving spectral notch
#  from the shape of the outer ear. Those three are what put a sound outside
#  your head instead of inside it.
#
#  Turning it off falls back to ordinary constant-power stereo panning. The two
#  are LEVEL MATCHED on purpose, so the difference you hear is the image and not
#  the volume.
# ---------------------------------------------------------------------------
HRTF=1


# ---------------------------------------------------------------------------
#  GpuMode - auto | on | off
#
#  READ THIS BEFORE CHANGING IT, because the name is misleading.
#
#  This does NOT decide whether you get ray-traced audio. You do, always. The
#  sound is traced on the SERVER's graphics card and sent to you as numbers,
#  so a ten-year-old GPU hears exactly what a new one hears.
#
#  What it decides is whether that tracing may one day be done on YOUR machine
#  instead of the server's - which needs a card that can trace rays in
#  hardware (NVIDIA RTX 3000 or newer, AMD RX 6000 or newer). That feature is
#  not built yet. For now this only controls what gets written to the log.
#
#     auto   work it out. The default.
#     on     ignore the check and treat this machine as eligible.
#     off    do not probe the graphics card at all.
#
#  If the log says your card was refused and you think that is wrong, put
#  "on" here - and please tell us what card it is, because that is a bug in
#  the check and not in your computer.
# ---------------------------------------------------------------------------
GpuMode=auto

# ---------------------------------------------------------------------------
#  VOICE CHAT - your microphone. OFF unless you turn it on.
#
#  Set Voice=1 to talk. Your microphone is then opened ONLY while you are on a
#  MonsterRPG server, and closed the moment you leave. The log names the device
#  it opened, and a green microphone appears on screen whenever audio is
#  actually leaving your machine.
#
#  Hold V to talk (rebindable in Options > Keyboard). Nothing is transmitted
#  unless that key is held.
# ---------------------------------------------------------------------------
Voice=0

#  Set this to 1 for an open microphone with no key to hold. Deliberately a
#  SECOND, separate step: enabling voice should not be the same decision as
#  letting the microphone transmit on its own.
VoiceOpenMic=0

#  OPEN MICROPHONE ONLY. How loud you must be for the gate to open, and how
#  quiet before it closes. Two numbers rather than one so it does not chatter
#  through the pauses inside a sentence. Neither applies to push-to-talk.
VoiceGateOpen=0.020
VoiceGateClose=0.008

#  PUSH TO TALK ONLY, and it is deliberately a much smaller number than the two
#  above. There the level is the decision; here the KEY is the decision and this
#  is nothing but an anti-silence guard, so it sits just above true digital
#  silence rather than above room tone.
#
#  Sharing the 0.008 above was a bug: a normal speaking voice into a line input
#  measured 0.0007-0.0066 here, i.e. every frame below the bar, so the key was
#  held and nothing was ever sent. Raise this only if a held key transmits hiss
#  from a very hot input.
VoicePttFloor=0.0015

#  How long an OPEN MICROPHONE keeps transmitting after you stop speaking.
VoiceHangoverMs=400

# ---------------------------------------------------------------------------
#  AIR ABSORPTION
#
#  Distant sounds are not just quieter, they are duller - the atmosphere eats
#  high frequencies far faster than low ones. This is that, as a one-pole filter
#  whose cutoff falls with distance.
#
#  The number is attenuation in dB per metre at 5 kHz, and the filter is solved
#  to hit it exactly rather than approximated, so this is a physical setting
#  rather than a taste one. 0.08 is roughly ISO 9613-1 at 20 C and 50% humidity:
#  about -1.6 dB of top end at 20 m, -8 dB at 100 m.
#
#  Raise it for a muggier, more distant-sounding world; set AirAbsorb=0 to
#  disable the filter entirely.
# ---------------------------------------------------------------------------
AirAbsorb=1
AirAbsorbDbPerM=0.08

# ---------------------------------------------------------------------------
#  ROOM REVERB - OFF by default, and that is deliberate.
#
#  The first build of this read its absorption out of the wrong field and could
#  produce decay times of over a minute: a reverb that never faded and simply
#  accumulated every sound put into it. It was loud enough to have to close the
#  game. The cause is fixed and there are now three separate limits that make it
#  impossible, but ''I found the bug'' and ''this is safe on your machine'' are
#  different claims, so it is opt-in until it has been heard once.
#
#  Set to 1 to try it. Indoors should gain a tail; open ground should gain
#  nothing at all. If anything sounds like it is building up rather than dying
#  away, set this back to 0 and say so.
# ---------------------------------------------------------------------------
Reverb=0
